<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D1117" />
    <meta
      name="description"
      content="Browse, filter, and manage your Pokémon Champions box with ease."
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/images/icon-192.svg" />
    <title>Pokémon Box Manager</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main id="app"></main>

    <!-- Firebase v9 compat SDK (global firebase object) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <!--
      App Check debug mode (local dev):
      On localhost, this prints a debug token to the browser console.
      Register it in Firebase Console → Security → App Check → Manage debug tokens.
      For the actual token value, set self.FIREBASE_APPCHECK_DEBUG_TOKEN = "TOKEN"
      instead of true (so the same token is reused across page loads).
      NEVER commit a real debug token to this file.
    -->
    <script>
      self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
    </script>

    <script src="/js/firebase-config.js"></script>
    <script type="module" src="/js/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => console.log("SW registered:", reg.scope))
            .catch((err) => console.error("SW registration failed:", err));
        });
      }
    </script>
  </body>
</html>
