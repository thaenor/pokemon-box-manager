<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5fa" />
    <meta name="description" content="Choose a tool for Pokémon Champions or Pokémon Violet." />
    <link rel="icon" type="image/svg+xml" href="./images/icon-192.svg" />
    <link rel="stylesheet" href="./css/landing.css" />
    <title>Pokémon Tools</title>
  </head>
  <body>
    <main class="chooser">
      <p class="site-name">
        <img src="./images/icon-192.svg" width="28" height="28" alt="" />
        Pokémon Tools
      </p>
      <h1>Choose your game</h1>
      <nav class="tool-grid" aria-label="Pokémon tools">
        <a class="tool tool--champions" href="./champions/" aria-labelledby="box-title champions">
          <div class="tool-art" aria-hidden="true">
            <img src="./images/icon-512.svg" width="124" height="124" alt="" />
          </div>
          <div class="tool-info">
            <p class="tool-game" id="champions">Pokémon Champions</p>
            <h2 id="box-title">Box Manager</h2>
            <p class="tool-description">Organize your boxes and find Pokémon for ranked battles.</p>
            <span class="tool-action" aria-hidden="true">Open Box Manager <span>→</span></span>
          </div>
        </a>
        <a class="tool tool--violet" href="./violet/" aria-labelledby="guide-title violet">
          <div class="tool-art" aria-hidden="true">
            <img src="./violet/icon-512.png" width="124" height="124" alt="" />
          </div>
          <div class="tool-info">
            <p class="tool-game" id="violet">Pokémon Violet</p>
            <h2 id="guide-title">Violet Field Guide</h2>
            <p class="tool-description">
              Look up evolution methods without spoilers and track your party.
            </p>
            <span class="tool-action" aria-hidden="true">Open Field Guide <span>→</span></span>
          </div>
        </a>
      </nav>
    </main>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
