<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D1117" />
    <meta
      name="description"
      content="Browse, filter, and manage your Pokémon Champions box with ease."
    />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./images/icon-192.svg" />
    <title>Pokémon Box Manager</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <nav class="companion-nav" aria-label="Trainer tools">
      <a href="./violet/">Violet Field Guide <span aria-hidden="true">↗</span></a>
    </nav>
    <main id="app"></main>

    <script type="module" src="./js/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => console.log("SW registered:", reg.scope))
            .catch((err) => console.error("SW registration failed:", err));
        });
      }
    </script>
  </body>
</html>
