<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D1117" />
    <meta
      name="description"
      content="Browse, filter, and manage your Pokémon Champions box with ease."
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/images/icon-192.svg" />
    <title>Pokémon Box Manager</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main id="app"></main>

    <!-- Firebase v9 compat SDK (global firebase object) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <!--
      App Check debug mode (local dev only):
      Uses a registered debug token on localhost so reCAPTCHA is bypassed during dev.
      The token D35EEDE6-12A6-4893-BB0D-C69B6622D72A is registered in Firebase Console
      under Security → App Check → Manage debug tokens.
      Production uses real reCAPTCHA Enterprise enforcement.
    -->
    <script>
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
        self.FIREBASE_APPCHECK_DEBUG_TOKEN = "D35EEDE6-12A6-4893-BB0D-C69B6622D72A";
      }
    </script>

    <script src="/js/firebase-config.js"></script>
    <script type="module" src="/js/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => console.log("SW registered:", reg.scope))
            .catch((err) => console.error("SW registration failed:", err));
        });
      }
    </script>
  </body>
</html>
